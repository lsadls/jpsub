[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jpsub"
version = "0.3.0"
description = "日语视频(底部短句 / 全屏打字机长文) -> 中文外挂 ASS 字幕(本地 OCR + 外部翻译)"
requires-python = ">=3.14"
dependencies = [
  "numpy>=1.26",
  "pysubs2>=1.9",
  "Pillow>=10",
  "tqdm>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jpsub = "jpsub.cli:main"

[tool.setuptools]
packages = ["jpsub"]
