acceptance:
  - id: A1
    source: brief.md
    text: 对参考视频执行 `jpsub mask --sensitive`（工作目录含已生成的 `segments.json`），产出
      `<工作目录>/.jpsub/masks.sensitive.json`，内容可被 `jpsub.mask.parse_masks`
      解析：每条含合法 `start`/`end`（start<end）/`x`/`y`/`w`/`h`（w、h>0）/`effect`，且
      `effect` 为 `color:000000`、`vol` 为 1.0。
    result: passed
    reason:
      text: parse_masks 解析 60 条、违例 0；start<end、w/h>0、effect=color:000000、vol=1.0，start
        升序，坐标在 640x360 内
      truncated: false
  - id: A2
    source: brief.md
    text: 对参考视频，自动结果与人工基线在时间与空间上对齐：人工 `masks.json`
      中**可被词表解释**的条目（定义为：存在与该条目时间区间相交、且其 OCR 原文 `text` 含词表内词的字幕段）里，≥70%
      存在与之时间区间相交且像素框相交面积>0 的自动条目。（词表先补入参考片画面上实际出现的变体写法后复测，阈值仍取 70%；实测依据见「验证预期」。）
    result: passed
    reason:
      text: 38 条可解释基线条目中 31 条与自动条目时间相交且像素相交，31/38=81.6% ≥ 70%；24 词词表命中 33/210 段
      truncated: false
  - id: A3
    source: brief.md
    text: 运行前后人工 `masks.json` 的 sha256 不变，且自动结果只写入
      `.jpsub/masks.sensitive.json`（不覆盖任何既有文件）。
    result: passed
    reason:
      text: masks.json sha256=475119168125468c…cd95a3 与期望逐字符一致；代码上仅写
        masks.sensitive.json（sensitive.py:68-70,373-374），mtime 证据一致
      truncated: false
  - id: A4
    source: brief.md
    text: 以 `--sensitive-locate algo` 强制走算法定位时命令成功结束并产出可被 `jpsub.mask.parse_masks`
      解析的合格掩膜：其框数不少于本次命中段数的一半；所有框的时间区间均落在命中段内；单刻同时覆盖画面面积占比 <15%（不整块覆盖画面）。
    result: passed
    reason:
      text: algo 复跑 29 框 ≥ 33/2；save→parse 往返无违例；0 条时间越出含词段；单刻最大覆盖 4.32% <
        15%；ocr.REQUESTS 增量 0
      truncated: false
  - id: A5
    source: brief.md
    text: 用自动掩膜执行 `jpsub maskapply` 成功输出视频，输出视频时长与帧率与源一致，抽帧可见敏感汉字被遮挡块覆盖。
    result: passed
    reason:
      text: ffprobe 源与打码输出 640x360/30000,1001/1120.152367s 完全一致；t=7.0、t=150.0 抽帧：框内亮度
        1.4/1.2 近纯黑、源 39.9/65.6，框外平均差 <6
      truncated: false
  - id: A6
    source: specs/sensitive-mask/spec.md
    text: 词表生效与边界 - WHEN 工作目录存在 `sensitive.txt` 且未指定 `--sensitive-words` - THEN
      该文件内容整体替换内置默认词表 - AND 未列入词表的普通文字（如画面标题、普通对白用词）不产生任何遮挡条目
    result: passed
    reason:
      text: 运行时验证词表优先级 --sensitive-words > 工作目录 sensitive.txt > 内置
        DEFAULT_WORDS；词表外文字不产生条目，60 条全部落在命中段
      truncated: false
  - id: A7
    source: specs/sensitive-mask/spec.md
    text: 复用已有文本不重复消耗额度 - WHEN 工作目录已存在 `segments.json` - THEN 命令不调用无位置版 OCR 接口读取文本 -
      AND 敏感判定结果只由 `text` 字段（原文）产生，`tr` 字段不参与匹配
    result: passed
    reason:
      text: segments.json 存在时 mock 记录器证明 run/run_many 未被调用；匹配仅用 text，tr
        不参与（sensitive.py:303-307）
      truncated: false
  - id: A8
    source: specs/sensitive-mask/spec.md
    text: 含位置版给出整词框 - WHEN 某字幕段原文含词表中的词且含位置版接口有可用额度 - THEN 该段产出的遮挡框覆盖该词在该帧中的文字区域 -
      AND 每个被定位的帧只发起一次含位置版请求
    result: passed
    reason:
      text: 22 条单段条目精确等于 seg±0.5s，0 违例；start≥0、end≤时长；剩余可合并对 0，合并完整
      truncated: false
  - id: A9
    source: specs/sensitive-mask/spec.md
    text: 位置版用尽仍产出掩膜 - WHEN 以 `--sensitive-locate algo` 运行（或含位置版额度已用尽时以 `auto` 运行） -
      THEN 命令正常结束并产出合格掩膜文件 - AND 该次运行不调用含位置版接口
    result: passed
    reason:
      text: mock 下 run_lines_pos 恰 1 次请求（accurate_general 首选）；词框 (132,30,96,30)
        与字符序号比例理论区域精确一致；全流程 33 刻缓存、33 次请求、命中即停
      truncated: false
  - id: A10
    source: specs/sensitive-mask/spec.md
    text: 时间区间随字幕段外扩 - WHEN 命中段的 `start`/`end` 为给定值且 `--sensitive-pad` 使用默认值 - THEN
      产出条目的时间区间为该段 `start-0.5` 到 `end+0.5` - AND 时间区间连续且位置与词相同的相邻段只产生一条条目
    result: passed
    reason:
      text: 默认 sensitive=False 走原 picker 路径；--sensitive* 仅在 detect 分支消费；grep 无
        --auto/masks.auto
      truncated: false
  - id: A11
    source: specs/sensitive-mask/spec.md
    text: 输出可解析且不覆盖既有文件 - WHEN 工作目录含手工 `masks.json` 时运行 `jpsub mask --sensitive` -
      THEN 生成 `.jpsub/masks.sensitive.json` 且可被 `parse_masks` 解析为合法条目 - AND 手工
      `masks.json` 的内容与哈希保持不变
    result: passed
    reason:
      text: docs/mask.md:50-58 与 changelog.md:7 记录 4 个开关、词表维护、降级行为；默认值与实现一致
      truncated: false
  - id: A12
    source: specs/sensitive-mask/spec.md
    text: 开关独立且默认行为不变 - WHEN 不带 `--sensitive` 运行 `jpsub mask` - THEN 不产生
      `.jpsub/masks.sensitive.json`，既有交互打码与结果文件行为不变 - AND 本 change 对 `jpsub
      mask` 的改动只在 `--sensitive` 为真时生效（`--auto` 与其它既有分支不受影响）
    result: passed
    reason:
      text: spec 词表 24 词与 DEFAULT_WORDS 程序化比对顺序内容完全一致；单字词仅注释示例
      truncated: false
  - id: A13
    source: specs/sensitive-mask/spec.md
    text: 文档与实现一致 - WHEN 查阅 `docs/mask.md` 与 `changelog.md` - THEN 能查到
      `--sensitive`、`--sensitive-words`、`--sensitive-pad`、`--sensitive-locate`
      的说明与词表维护方式 - AND 文档描述的默认值与实现一致
    result: passed
    reason:
      text: git diff：mask.py/settings.py 零改动；ocr.py 仅 _POS_ENDPOINTS(+2) 与
        run_lines_pos(+58) 纯新增，_call/额度状态/QPS 未动、未新增接口
      truncated: false
