  summary:
    text: 实现敏感汉字自动打码（A1–A13 全部覆盖）。新模块 jpsub/sensitive.py：读工作目录 segments.json
      画面原文按词表子串匹配命中段，逐段采样帧定位敏感词框——含位置版百度 OCR（新增 BaiduOcrEngine.run_lines_pos，只用
      accurate_general/general，两接口 17/19/3 用尽时标记并降级）按行框+字符序号切整词框；算法降级复用
      frames._binary_mask 水平投影检测文字行、按行容量对应原文各行切框（不占额度）。命中段区间=start/end 各外扩
      pad（默认 0.5s），相邻段同位置框合并，结果写 .jpsub/masks.sensitive.json，不触碰手工
      masks.json。cli.py mask 子命令新增
      --sensitive/--sensitive-words/--sensitive-pad/--sensitive-locate
      auto|ocr|algo；词表 DEFAULT_WORDS 扩至 24 词（含参考片画面实际出现的
      雄堕ち/雄膣/淫獣/ケツマンコ/デカマラ/性処理/性欲/露出/股間/媚薬 等变体），可由
      sensitive.txt/--sensitive-words 替换；docs/mask.md、changelog.md
      已同步。开发期实测（参考片，注入主仓密钥）：auto 产出 60 条、33 次含位置版请求（每命中段 1 次），parse_masks 60/60
      字段合法、effect=color:000000/vol=1.0；人工基线 39 条中可被词表解释 38 条、覆盖 31 条=82%（A2 阈值
      70%）；masks.json sha256=475119…95a3 前后不变（A3）；--sensitive-locate algo 全程 0 次
      OCR 请求、产出 29 条 ≥ 命中段 33/2、框时间全落在命中段内、单刻最大同时覆盖面积 4.3%（A4 <15%）；maskapply
      端到端输出时长 1120.152367s/帧率 30000/1001/帧数 33571 与源一致，抽帧 t=155s 生效 9
      条框内画面均由有字变纯黑（A5）；降级分支（模拟含位置版全部不可用）自动落算法且禁用 run/run_many
      的断言通过（复用原文、不耗无位置版额度）；自定义词表文件（仅 ホモ）命中 2 段并正确产出。
    truncated: false
