      /ping 携带 pageId,pagehide 经 sendBeacon 注销(/page-close,GET+POST
      均支持路由);服务端维护存活页面集合,超过 8s 无心跳的页面视为失效,最后一个页面注销且 2s 宽限期内无新注册才 shutdown(/quit
      空 body 旧信道路径同样先看存活集合;/quit 非空 body 的「退出程序」语义不变,仍 kill 全部子进程后
      os._exit)。②字幕时间轴:jpsub/ocr.py 的 _stitch
      帧编号字体改为跨平台候选列表(_MARKER_FONTS:Linux/Windows/macOS 常见字体路径)+ Pillow
      内置默认字体回退,不再因 Windows 无 Linux 字体路径而跳过编号绘制;_run_stitched 的无位置版切分增加失败防护,批内
      n>1
